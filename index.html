<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BRLD - Acheter votre crypto</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background:#121212; color:white; text-align:center; padding:30px; 
    }
    h1 { color:#ffcc00; }
    button { 
      background:#ffcc00; border:none; padding:15px 30px; font-size:16px; 
      cursor:pointer; margin:10px; border-radius:8px; transition:0.3s; 
    }
    button:hover { background:#e6b800; }
    input { 
      padding:10px; margin:10px 0; width:80%; max-width:300px; font-size:16px; border-radius:5px; border:none; 
    }
    #status { margin-top:20px; font-weight:bold; color:#ffcc00; white-space:pre-line; }
    .container { max-width:500px; margin:auto; }
    p { margin:10px 0; }
  </style>
</head>
<body>

<div class="container">
  <h1>BRLD - Acheter votre crypto</h1>
  <p>Connectez votre wallet MetaMask pour acheter des BRLD</p>

  <button id="connect">Connecter MetaMask</button>
  <p id="wallet">Wallet non connecté</p>

  <input type="number" id="amount" placeholder="Nombre de BRLD à acheter" min="1">
  <p>Total à payer: <span id="total">0 ETH</span></p>

  <button id="buy">Acheter BRLD</button>

  <p id="status"></p>
</div>

<script>
document.getElementById("connect").onclick = () => {
  if(window.ethereum){
    alert("MetaMask détecté !");
  } else {
    alert("MetaMask non détecté !");
  }
};
</script>

</body>
</html>
