<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test MetaMask</title>
</head>
<body>

<button id="connect">Connecter MetaMask</button>
<p id="wallet">Wallet non connecté</p>

<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
<script>
let provider;
let signer;
let userAddress;

document.getElementById("connect").onclick = async () => {
  if(!window.ethereum){ alert("MetaMask non détecté !"); return; }
  try {
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    alert("Wallet connecté : " + accounts[0]);
  } catch(err){
    console.error(err);
    alert("Erreur : " + err.message);
  }
};
</script>

</body>
</html>
