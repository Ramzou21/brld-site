<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRLD - Acheter votre crypto</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#121212; color:white; text-align:center; padding:30px; }
  h1 { color:#ffcc00; }
  button { background:#ffcc00; border:none; padding:15px 30px; font-size:16px; cursor:pointer; margin:10px; border-radius:8px; transition:0.3s; }
  button:hover { background:#e6b800; }
  input { padding:10px; margin:10px 0; width:80%; max-width:300px; font-size:16px; border-radius:5px; border:none; }
  #status { margin-top:20px; font-weight:bold; color:#ffcc00; white-space:pre-line; }
  .container { max-width:500px; margin:auto; }
  p { margin:10px 0; }
</style>
</head>
<body>
  <button id="connect">Connecter MetaMask</button>
  <p id="wallet">Wallet non connecté</p>

  <!-- ethers.js -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js" defer></script>

  <!-- Ton code JS -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    let provider, signer, userAddress;
    const brldWallet = "0x5D7Cf964e1192f02e9Ba2C4B700336f3e298Ba3c";
    const brldPriceETH = 0.001;

    const updateTotal = () => {
      const amount = parseFloat(document.getElementById("amount")?.value);
      const total = amount && amount > 0 ? (amount * brldPriceETH).toFixed(6) : 0;
      document.getElementById("total").innerText = `${total} ETH`;
    };

    document.getElementById("amount")?.addEventListener("input", updateTotal);

    document.getElementById("connect")?.addEventListener("click", async () => {
      if(!window.ethereum) { alert("Installe MetaMask !"); return; }
      try {
        provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);
        signer = provider.getSigner();
        userAddress = await signer.getAddress();
        document.getElementById("wallet").innerText = `Wallet connecté : ${userAddress}`;
        updateTotal();
      } catch(e) { console.error(e); alert("Erreur lors de la connexion au wallet !"); }
    });

    document.getElementById("buy")?.addEventListener("click", async () => {
      const amountBRLD = parseFloat(document.getElementById("amount")?.value);
      if(!signer){ alert("Connecte ton wallet d'abord !"); return; }
      if(!amountBRLD || amountBRLD <= 0){ alert("Nombre de BRLD invalide !"); return; }

      const totalETH = (amountBRLD * brldPriceETH).toFixed(6);
      try {
        const tx = { to: brldWallet, value: ethers.utils.parseEther(totalETH.toString()) };
        const transaction = await signer.sendTransaction(tx);
        document.getElementById("status").innerText = `Transaction envoyée !\nTx Hash: ${transaction.hash}\nEnvoie maintenant ${amountBRLD} BRLD à ${userAddress}`;
        await transaction.wait();
        alert("Paiement confirmé ! Envoie les BRLD manuellement.");
      } catch(e){ console.error(e); alert("Erreur lors du paiement !"); }
    });
  });
  </script>
</body>

</html>
